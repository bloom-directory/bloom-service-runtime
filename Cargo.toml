[workspace]
members = [
  "crates/bloom-audit-checkpoint",
  "crates/bloom-platform-containment",
  "crates/bloom-rpc-wire",
  "crates/bloom-service-observability",
  "crates/bloom-service-activation",
  "crates/bloom-triad-local-transport",
  "crates/bloom-trusted-time",
]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/bloom-directory/bloom-service-runtime"

[workspace.dependencies]
base64 = "0.22"
bloom-rpc-wire = { path = "crates/bloom-rpc-wire" }
bloom-trusted-time = { path = "crates/bloom-trusted-time" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
libc = "0.2"
rand = "0.8"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
